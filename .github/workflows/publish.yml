# Build every published native artifact from source before creating a release.
# Only an explicit version-tag push can publish. All other runs are compile-only.

name: publish

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.gitmodules'
      - '.gitignore'
      - 'src/**'
      - 'third_party/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'sync_local_plugins.sh'
      - 'dev.example.json'
      - 'VERSION'
      - '!**/*.md'
      - '!**/*.rst'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.gitmodules'
      - '.gitignore'
      - 'src/**'
      - 'third_party/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'sync_local_plugins.sh'
      - 'dev.example.json'
      - 'VERSION'
      - '!**/*.md'
      - '!**/*.rst'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  SOLAR2D_YEAR: '2025'
  SOLAR2D_BUILD: '3720'
  PLUGIN_BUILD: '2025.3720'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate version and release intent
        run: python3 scripts/release_policy.py --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF"
      - run: python3 scripts/check_public_tree.py
      - run: python3 -m unittest discover -s tests/tooling -v

  build-macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out Solar2D public native headers
        uses: actions/checkout@v4
        with:
          repository: coronalabs/corona
          ref: ${{ env.SOLAR2D_BUILD }}
          path: _solar2d
          sparse-checkout: |
            librtt/Corona
            external/lua-5.1.3/src
          fetch-depth: 1

      - name: Prepare Corona Native header layout
        run: sudo bash .github/scripts/prepare-solar2d-native-headers.sh _solar2d /Applications/CoronaEnterprise

      - name: Build macOS Simulator plugin
        run: |
          mkdir -p build-output
          PLUGIN_BUILD="$PLUGIN_BUILD" bash src/mac/build.sh "$PWD/build-output"
          arches="$(lipo -archs build-output/plugin_geometry2d.dylib)"
          echo "$arches" | grep x86_64
          echo "$arches" | grep arm64
          nm -gU build-output/plugin_geometry2d.dylib | grep luaopen_plugin_geometry2d
          mkdir -p staging/plugin-build/mac-sim
          cp build-output/plugin_geometry2d.dylib staging/plugin-build/mac-sim/

      - uses: actions/upload-artifact@v4
        with:
          name: geometry2d-macos
          path: staging/plugin-build
          if-no-files-found: error

  build-ios:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out Solar2D public native headers
        uses: actions/checkout@v4
        with:
          repository: coronalabs/corona
          ref: ${{ env.SOLAR2D_BUILD }}
          path: _solar2d
          sparse-checkout: |
            librtt/Corona
            external/lua-5.1.3/src
          fetch-depth: 1

      - name: Prepare Corona Native header layout
        run: sudo bash .github/scripts/prepare-solar2d-native-headers.sh _solar2d /Applications/CoronaEnterprise

      - name: Build and stage iOS plugins
        run: |
          PLUGIN_BUILD="$PLUGIN_BUILD" bash src/ios/build.sh
          test "$(lipo -archs plugins/$PLUGIN_BUILD/iphone/libplugin_geometry2d.a)" = "arm64"
          sim_arches="$(lipo -archs plugins/$PLUGIN_BUILD/iphone-sim/libplugin_geometry2d.a)"
          echo "$sim_arches" | grep x86_64
          echo "$sim_arches" | grep arm64
          mkdir -p staging/plugin-build
          cp -R plugins/$PLUGIN_BUILD/iphone staging/plugin-build/
          cp -R plugins/$PLUGIN_BUILD/iphone-sim staging/plugin-build/

      - uses: actions/upload-artifact@v4
        with:
          name: geometry2d-ios
          path: staging/plugin-build
          if-no-files-found: error

  build-tvos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out Solar2D public native headers
        uses: actions/checkout@v4
        with:
          repository: coronalabs/corona
          ref: ${{ env.SOLAR2D_BUILD }}
          path: _solar2d
          sparse-checkout: |
            librtt/Corona
            external/lua-5.1.3/src
          fetch-depth: 1

      - name: Prepare Corona Native header layout
        run: sudo bash .github/scripts/prepare-solar2d-native-headers.sh _solar2d /Applications/CoronaEnterprise

      - name: Build and stage tvOS plugin
        run: |
          PLUGIN_BUILD="$PLUGIN_BUILD" bash src/tvos/build.sh
          test -f plugins/$PLUGIN_BUILD/appletvos/Corona_plugin_geometry2d.xcframework/Info.plist
          mkdir -p staging/plugin-build
          cp -R plugins/$PLUGIN_BUILD/appletvos staging/plugin-build/

      - uses: actions/upload-artifact@v4
        with:
          name: geometry2d-tvos
          path: staging/plugin-build
          if-no-files-found: error

  build-android:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out Solar2D public native headers
        uses: actions/checkout@v4
        with:
          repository: coronalabs/corona
          ref: ${{ env.SOLAR2D_BUILD }}
          path: _solar2d
          sparse-checkout: |
            librtt/Corona
            external/lua-5.1.3/src
          fetch-depth: 1

      - name: Prepare Corona Native header layout
        run: sudo bash .github/scripts/prepare-solar2d-native-headers.sh _solar2d /Applications/CoronaEnterprise

      - name: Download CoronaCards Android runtime
        run: |
          curl -sSL --fail \
            -o "$RUNNER_TEMP/CoronaCards-Android.zip" \
            "https://github.com/coronalabs/corona/releases/download/$SOLAR2D_BUILD/CoronaCards-Android-$SOLAR2D_YEAR.$SOLAR2D_BUILD.zip"
          unzip -q "$RUNNER_TEMP/CoronaCards-Android.zip" CoronaCards.aar -d "$RUNNER_TEMP/corona-cards"
          sudo mkdir -p /Applications/CoronaEnterprise/Corona/android/lib/gradle
          sudo cp "$RUNNER_TEMP/corona-cards/CoronaCards.aar" \
            /Applications/CoronaEnterprise/Corona/android/lib/gradle/Corona.aar

      - name: Install Android NDK r27c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build and stage Android plugins
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          CORONA_NATIVE: /Applications/CoronaEnterprise
          CORONA_AAR: /Applications/CoronaEnterprise/Corona/android/lib/gradle/Corona.aar
        run: |
          PLUGIN_BUILD="$PLUGIN_BUILD" bash src/android/build.sh
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            library="plugins/$PLUGIN_BUILD/android/jniLibs/$abi/libplugin.geometry2d.so"
            test -f "$library"
            file "$library"
          done
          mkdir -p staging/plugin-build
          cp -R plugins/$PLUGIN_BUILD/android staging/plugin-build/

      - uses: actions/upload-artifact@v4
        with:
          name: geometry2d-android
          path: staging/plugin-build
          if-no-files-found: error

  build-win32:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and install Solar2D Native SDK
        shell: pwsh
        run: |
          $url = "https://github.com/coronalabs/corona/releases/download/$env:SOLAR2D_BUILD/Solar2D-Windows-$env:SOLAR2D_YEAR.$env:SOLAR2D_BUILD.msi"
          curl.exe -L --fail -o solar2d.msi $url
          if (-not (Test-Path solar2d.msi)) { throw "Solar2D MSI download failed" }
          $process = Start-Process msiexec.exe -ArgumentList '/i','solar2d.msi','/qn','/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "msiexec failed with exit code $($process.ExitCode)" }

      - name: Locate Corona Native SDK
        shell: pwsh
        run: |
          $roots = @('C:\Program Files (x86)', 'C:\Program Files')
          $lib = Get-ChildItem $roots -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Corona\\win\\lib$' } |
            Select-Object -First 1
          if (-not $lib) { throw "Corona Native SDK win\lib was not found after install" }
          $root = $lib.Parent.Parent.Parent.FullName
          "CORONA_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CORONA_ROOT=$root"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and package Windows Simulator plugin
        shell: cmd
        run: src\win32\build.bat

      - name: Verify and stage win32-sim plugin
        shell: pwsh
        run: |
          $dll = "plugins\$env:PLUGIN_BUILD\win32-sim\plugin_geometry2d.dll"
          if (-not (Test-Path $dll)) { throw "plugin_geometry2d.dll was not packaged" }
          $exports = dumpbin.exe /exports $dll
          if (-not ($exports | Select-String 'luaopen_plugin_geometry2d')) {
            throw "luaopen_plugin_geometry2d is not exported"
          }
          New-Item -ItemType Directory -Force staging\plugin-build | Out-Null
          Copy-Item -Recurse "plugins\$env:PLUGIN_BUILD\win32-sim" staging\plugin-build\

      - uses: actions/upload-artifact@v4
        with:
          name: geometry2d-win32
          path: staging/plugin-build
          if-no-files-found: error

  publish-release:
    needs:
      - validate
      - build-macos
      - build-ios
      - build-tvos
      - build-android
      - build-win32
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/release-check.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          if [ "$status" != 404 ]; then
            echo "Refusing release creation: expected absent release (404), got $status"
            exit 1
          fi

      - name: Prepare generated release directory
        run: |
          rm -rf "plugins/$PLUGIN_BUILD"
          mkdir -p "plugins/$PLUGIN_BUILD"

      - uses: actions/download-artifact@v4
        with:
          pattern: geometry2d-*
          path: plugins/${{ env.PLUGIN_BUILD }}
          merge-multiple: true

      - name: Verify complete release tree
        run: |
          test -f "plugins/$PLUGIN_BUILD/mac-sim/plugin_geometry2d.dylib"
          test -f "plugins/$PLUGIN_BUILD/iphone/libplugin_geometry2d.a"
          test -f "plugins/$PLUGIN_BUILD/iphone-sim/libplugin_geometry2d.a"
          test -f "plugins/$PLUGIN_BUILD/appletvos/Corona_plugin_geometry2d.xcframework/Info.plist"
          test -f "plugins/$PLUGIN_BUILD/win32-sim/plugin_geometry2d.dll"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f "plugins/$PLUGIN_BUILD/android/jniLibs/$abi/libplugin.geometry2d.so"
          done
          find "plugins/$PLUGIN_BUILD" -type f -not -name '.DS_Store' | sort

      - name: Package each platform
        run: |
          cd "plugins/$PLUGIN_BUILD"
          for platform in */; do
            platform="${platform%/}"
            (
              cd "$platform"
              tar -czvf "../../$PLUGIN_BUILD-$platform.tgz" --exclude='.*' *
            )
          done

      - name: Create draft, upload all artifacts, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Release $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" plugins/"$PLUGIN_BUILD"-*.tgz
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Request Solar2D directory update
        shell: bash
        env:
          ISSUE_PAT: ${{ secrets.ISSUE_PAT }}
        run: |
          if [ -z "$ISSUE_PAT" ]; then
            echo "No ISSUE_PAT secret; skipping directory update."
            exit 0
          fi
          curl --fail-with-body --request POST \
            --url https://api.github.com/repos/solar2d/plugins.solar2d.com/dispatches \
            --header "authorization: Bearer $ISSUE_PAT" \
            --header 'content-type: application/json' \
            --data "{\"event_type\":\"repo_updated\",\"client_payload\":{\"repo\":\"${{ github.repository }}\"}}"
