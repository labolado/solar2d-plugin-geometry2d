# Builds the win32 plugin (plugin_geometry2d.dll) fresh on a Windows runner, then
# publishes it together with the already-committed platform binaries under
# plugins/**. The publish step replicates solar2d/directory-plugin-action's
# packaging INLINE (not by calling the action) — see the publish-release job for
# why (the action re-checks-out and would wipe the injected, uncommitted DLL).
#
# Why build win32 here instead of committing a prebuilt DLL: the plugin is
# authored on macOS, so the Windows binary can't be produced locally. CI is the
# only place it gets built — so it's built on every publish and injected into the
# plugins/ tree the publish action consumes. The DLL is never committed.
#
# NOTE: the Windows build chain (including the Corona Native SDK install path) is
# UNVERIFIED on a real runner. geometry2d has no codec or other prebuilt native
# library dependencies; polypartition and earcut are built from source. The steps
# probe + fail loudly so the first few CI runs pinpoint what needs tweaking.
# publish-release depends on build-win32, so a red Windows build blocks the
# release (win32 is published *together* with the others, by design).

name: publish

# Release is cut only on the deliberate signals below (push to plugins/** etc.).
# A manual "Run workflow" (workflow_dispatch) builds win32 only and skips the
# publish job — so the unverified Windows build can be iterated without cutting
# a release every time (publish-release is gated on the event type).
on:
  push:
    paths:
      - 'plugins/**'
      - 'docs/**'
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Corona/Solar2D build whose Native SDK we build + link against. Matches the
  # plugins/<YEAR.BUILD>/ folder so the ABI lines up. Bump together with that
  # folder if you retarget a newer Solar2D build.
  SOLAR2D_YEAR: '2025'
  SOLAR2D_BUILD: '3720'
  # The committed plugins folder for this build (plugins/<PLUGIN_BUILD>/...).
  PLUGIN_BUILD: '2025.3720'

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download + install Solar2D (Corona Native SDK)
        shell: pwsh
        run: |
          $url = "https://github.com/coronalabs/corona/releases/download/$env:SOLAR2D_BUILD/Solar2D-Windows-$env:SOLAR2D_YEAR.$env:SOLAR2D_BUILD.msi"
          Write-Host "Downloading $url"
          curl.exe -L --fail -o solar2d.msi $url
          if (-not (Test-Path solar2d.msi)) { throw "Solar2D MSI download failed" }
          Write-Host "Installing silently..."
          $p = Start-Process msiexec.exe -ArgumentList '/i','solar2d.msi','/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }

      - name: Locate Native SDK and export CORONA_ROOT
        shell: pwsh
        run: |
          # The .vcxproj references $(CORONA_ROOT)\Corona\win\lib and
          # $(CORONA_ROOT)\Corona\shared\include, so CORONA_ROOT is the directory
          # that *contains* the `Corona` folder. Find it by locating win\lib.
          $roots = @('C:\Program Files (x86)','C:\Program Files')
          $lib = Get-ChildItem $roots -Recurse -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\Corona\\win\\lib$' } |
                 Select-Object -First 1
          if (-not $lib) {
            Write-Host "Could not find Corona\win\lib. Dumping install tree:"
            Get-ChildItem 'C:\Program Files (x86)\Corona Labs' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Corona Native SDK win\lib not found after install"
          }
          # ...\<ROOT>\Corona\win\lib  ->  <ROOT>
          $root = $lib.Parent.Parent.Parent.FullName
          Write-Host "CORONA_ROOT=$root"
          "CORONA_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "win\lib contents:"
          Get-ChildItem "$root\Corona\win\lib" | Select-Object -ExpandProperty Name

      # Full MSVC x86 environment (cl, msbuild, INCLUDE, LIB) for the plugin
      # build. Solar2D's Windows Simulator and native plugins are Win32/x86.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build plugin_geometry2d.dll (msbuild, Release/Win32)
        shell: pwsh
        # PostBuildEventUseInBuild=false disables the project's post-build xcopy,
        # which deploys the DLL into the local Corona Simulator Plugins dir for dev
        # convenience — pointless in CI, and its `xcopy /E` prompts interactively
        # for a single file (F/D?), which hangs/fails on a non-interactive runner.
        run: msbuild src\win32\Plugin.sln /p:Configuration=Release /p:Platform=Win32 /m /p:PostBuildEventUseInBuild=false

      - name: Stage win32-sim artifact
        shell: pwsh
        run: |
          $dll = "src\win32\Release\plugin_geometry2d.dll"
          if (-not (Test-Path $dll)) { $dll = "src\win32\Win32\Release\plugin_geometry2d.dll" }
          if (-not (Test-Path $dll)) {
            Write-Host "Searching for plugin_geometry2d.dll:"
            Get-ChildItem src\win32 -Recurse -Filter plugin_geometry2d.dll -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "plugin_geometry2d.dll not found after build"
          }
          New-Item -ItemType Directory -Force -Path staging\win32-sim | Out-Null
          Copy-Item $dll staging\win32-sim\plugin_geometry2d.dll
          Write-Host "Staged: staging\win32-sim\plugin_geometry2d.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: win32-sim
          path: staging/win32-sim/plugin_geometry2d.dll
          if-no-files-found: error

  publish-release:
    needs: build-win32
    # Skip manual runs (workflow_dispatch) so the Windows build can be iterated
    # without publishing, and only release from the default branch (same guard
    # solar2d/directory-plugin-action applies internally).
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'repository_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Inject the freshly built win32 DLL into the plugins tree.
      - uses: actions/download-artifact@v4
        with:
          name: win32-sim
          path: plugins/${{ env.PLUGIN_BUILD }}/win32-sim

      - name: Show plugins tree to be published
        run: find plugins -type f -not -name '.DS_Store' | sort

      # Replicate solar2d/directory-plugin-action's packaging INLINE. We cannot
      # call the action: its first step is its own `actions/checkout`, which wipes
      # the injected (uncommitted) win32 DLL from the workspace before tarring, so
      # win32 would never be published. Same tar as the action.
      - name: Package each platform into <build>-<platform>.tgz
        run: |
          cd plugins
          for build in */; do
            build="${build%/}"
            ( cd "$build"
              for platform in */; do
                platform="${platform%/}"
                ( cd "$platform"
                  ls * >/dev/null 2>&1 || exit 0
                  tar -czvf ../../"$build-$platform.tgz" --exclude=".*" *
                )
              done
            )
          done
          echo "Produced:"; ls -la *.tgz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: plugins/*.tgz
          name: Release v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Ask the Solar2D plugin directory to refresh (same dispatch the action does).
      - name: Request Solar2D directory update
        shell: bash
        env:
          ISSUE_PAT: ${{ secrets.ISSUE_PAT }}
        run: |
          if [ -z "$ISSUE_PAT" ]; then echo "No ISSUE_PAT secret; skipping directory update."; exit 0; fi
          curl --request POST \
            --url https://api.github.com/repos/solar2d/plugins.solar2d.com/dispatches \
            --header "authorization: Bearer $ISSUE_PAT" \
            --header 'content-type: application/json' \
            --data "{\"event_type\":\"repo_updated\",\"client_payload\":{\"repo\":\"${{ github.repository }}\"}}"
