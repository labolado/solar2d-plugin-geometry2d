name: source checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.gitmodules'
      - '.gitignore'
      - 'src/**'
      - 'third_party/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'sync_local_plugins.sh'
      - 'dev.example.json'
      - 'VERSION'
      - '!**/*.md'
      - '!**/*.rst'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_public_tree.py
      - run: python3 -m unittest discover -s tests/tooling -v
